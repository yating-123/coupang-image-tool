<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>商品照片校正＋白底棚拍工具 V13</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="hero">
  <div class="eyebrow">電商商品圖片工具</div>
  <h1>商品照片校正＋白底棚拍工具</h1>
  <p>商品像素鎖定 × 白平衡 × 棚拍光線 × 白底 × 自然陰影</p>
  <div class="badge">V13｜棚拍光線版</div>
  <div class="sub">不重新生成商品，只改善原照片的色溫、亮度、光線與背景</div>
</header>
<main class="container">
<section class="card">
  <label class="dropzone" id="dropzone">
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="plus">＋</div><strong>拖曳商品照片到這裡</strong>
    <span>或點擊選擇圖片，可一次選擇多張</span><small>JPG / PNG / WebP</small>
  </label>
  <div class="file-status" id="fileStatus">尚未選取檔案</div>
</section>
<section class="card" id="selectCard">
  <h2>商品範圍</h2>
  <p class="intro">只框住完整商品。框內像素鎖定，不做去背；框外背景會變成純白。</p>
  <div class="editor-wrap"><canvas id="editor"></canvas></div>
  <div class="action-grid"><button class="primary small" id="smartBtn">智慧框選</button><button class="secondary small" id="resetBtn">重新框選</button></div>
  <div class="tip">拖曳四個角貼近商品外框，不需要沿邊緣逐點描繪。</div>
</section>
<section class="card">
  <h2>棚拍校正</h2>
  <p class="intro">預設為保守棚拍校正，優先保留商品原色、Logo 與文字。</p>
  <div class="control"><div><b>自動白平衡</b><span id="wbVal">開啟</span></div><label class="switch"><input id="wb" type="checkbox" checked><i></i></label></div>
  <div class="control"><div><b>棚拍亮度</b><span id="brightVal">＋12</span></div><input id="brightness" type="range" min="0" max="30" value="12"></div>
  <div class="control"><div><b>棚拍對比</b><span id="contrastVal">＋5</span></div><input id="contrast" type="range" min="0" max="15" value="5"></div>
  <div class="control"><div><b>自然接觸陰影</b><span id="shadowVal">開啟</span></div><label class="switch"><input id="shadow" type="checkbox" checked><i></i></label></div>
  <div class="tip">只處理原始商品像素，不重新生成商品。</div>
</section>
<section class="card">
  <h2>輸出</h2>
  <div class="row">
    <label class="selectbox"><span>輸出尺寸</span><select id="size"><option value="1000">1000 × 1000 px</option><option value="1200">1200 × 1200 px</option><option value="1500">1500 × 1500 px</option></select></label>
    <label class="selectbox"><span>輸出格式</span><select id="format"><option value="image/jpeg">JPG 95%</option><option value="image/png">PNG</option><option value="image/webp">WebP 95%</option></select></label>
  </div>
  <button class="primary" id="processBtn" disabled>開始製作白底棚拍圖</button>
  <div class="progress-wrap hidden" id="progressWrap"><div class="progress-label"><span id="progressText">準備中</span><span id="progressPct">0%</span></div><div class="progress"><i id="progressBar"></i></div></div>
  <div class="error" id="error"></div>
</section>
<section class="card results-card"><div class="results-head"><h2>處理結果</h2><button class="clear" id="clearBtn">清除全部</button></div><div id="results"><div class="empty">尚無處理結果</div></div><button class="secondary" id="zipBtn" disabled>下載全部 ZIP</button></section>
</main>
<script src="studio.js"></script>
</body>
</html>
