<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>商品白底棚拍工具 V10</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="hero">
  <div class="eyebrow">電商商品圖片工具</div>
  <h1>商品白底棚拍工具</h1>
  <p>商品保真 × 智慧框選 × 純白背景</p>
  <div class="badge">V10｜智慧框選＋商品保真版</div>
  <div class="sub">改用「四角框選＋智慧去背景」，不再需要逐點描邊</div>
</header>

<main class="container">
<section class="card">
  <label class="dropzone" id="dropzone">
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="plus">＋</div>
    <strong>拖曳商品照片到這裡</strong>
    <span>或點擊選擇圖片，可一次選擇多張</span>
    <small>JPG / PNG / WebP</small>
  </label>
  <div class="file-status" id="fileStatus">尚未選取檔案</div>
</section>

<section class="card" id="selectCard">
  <h2>商品範圍</h2>
  <p class="intro">不用沿著商品描邊。只要框住整個商品，工具會從框內外的色差判斷背景並保留商品。</p>

  <div class="editor-wrap">
    <canvas id="editor"></canvas>
  </div>

  <div class="action-grid">
    <button class="primary small" id="smartBtn">智慧框選</button>
    <button class="secondary small" id="resetBtn">重新框選</button>
  </div>
  <div class="tip">拖曳四個角調整範圍。白色盒裝商品建議框住完整外盒，不要框到太多背景。</div>

  <div class="setting">
    <div class="setting-title"><span>背景保留程度</span><b id="thresholdValue">24</b></div>
    <input id="threshold" type="range" min="10" max="45" value="24">
    <div class="hint">數值越低越保守，適合白色商品；數值越高會清掉更多相近背景。</div>
  </div>

  <label class="check"><input id="shadow" type="checkbox" checked><span>加入自然接觸陰影</span></label>

  <div class="row">
    <label class="selectbox"><span>輸出尺寸</span>
      <select id="size"><option value="1000">1000 × 1000 px</option><option value="1200">1200 × 1200 px</option><option value="1500">1500 × 1500 px</option></select>
    </label>
    <label class="selectbox"><span>輸出格式</span>
      <select id="format"><option value="image/jpeg">JPG 95%</option><option value="image/png">PNG</option><option value="image/webp">WebP 95%</option></select>
    </label>
  </div>

  <button class="primary" id="processBtn" disabled>開始製作白底棚拍圖</button>
  <div class="progress-wrap hidden" id="progressWrap">
    <div class="progress-label"><span id="progressText">準備中</span><span id="progressPct">0%</span></div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>
  <div class="error" id="error"></div>
</section>

<section class="card results-card">
  <div class="results-head"><h2>處理結果</h2><button class="clear" id="clearBtn">清除全部</button></div>
  <div id="results"><div class="empty">尚無處理結果</div></div>
  <button class="secondary" id="zipBtn" disabled>下載全部 ZIP</button>
</section>
</main>
<script src="studio.js"></script>
</body>
</html>
