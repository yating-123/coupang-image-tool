<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>商品白底棚拍工具 V3.1｜商品保真＋智慧去背版</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<main class="container">
<header class="hero">
  <div class="brand">電商商品圖片工具</div>
  <h1>商品白底棚拍工具</h1>
  <p>商品保真去背 × 純白背景 × 自然陰影</p>
  <span class="version">V3.1｜商品保真＋智慧去背版</span>
</header>

<section class="card upload-card">
  <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="選擇商品照片">
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/*" multiple>
    <button type="button" id="pickBtn" class="pick-btn">＋</button>
    <strong>選擇商品照片</strong>
    <span>點擊這裡選擇圖片，可一次選擇多張</span>
    <small>JPG / PNG / WebP</small>
  </div>
  <div id="fileSummary" class="file-summary">尚未選取檔案</div>
</section>

<section class="card">
  <div class="section-title"><h2>智慧去背</h2><p>保留商品原始像素，只處理背景與陰影。</p></div>
  <div class="settings">
    <div class="field wide">
      <label for="mode">去背模式</label>
      <select id="mode">
        <option value="safe" selected>保真保守｜推薦白色商品</option>
        <option value="balanced">標準智慧｜背景較複雜時</option>
        <option value="strong">強力去背｜背景較深、對比高</option>
      </select>
    </div>
    <div class="field">
      <label for="bgTolerance">背景相似度</label>
      <div class="range-row"><input id="bgTolerance" type="range" min="8" max="55" value="24"><output id="bgToleranceOut">24</output></div>
    </div>
    <div class="field">
      <label for="edgeBarrier">邊界保護</label>
      <div class="range-row"><input id="edgeBarrier" type="range" min="8" max="60" value="28"><output id="edgeBarrierOut">28</output></div>
    </div>
    <div class="field">
      <label for="edgeProtect">外框保護</label>
      <div class="range-row"><input id="edgeProtect" type="range" min="0" max="8" value="3"><output id="edgeProtectOut">3 px</output></div>
    </div>
    <div class="field">
      <label for="feather">邊緣柔化</label>
      <div class="range-row"><input id="feather" type="range" min="0" max="2" value="0.5" step="0.5"><output id="featherOut">0.5 px</output></div>
    </div>
  </div>
</section>

<section class="card">
  <div class="section-title"><h2>商品位置與陰影</h2></div>
  <div class="settings">
    <div class="field">
      <label for="canvasRatio">商品佔畫布比例</label>
      <div class="range-row"><input id="canvasRatio" type="range" min="65" max="92" value="82"><output id="canvasRatioOut">82%</output></div>
    </div>
    <div class="field">
      <label for="shadowStrength">陰影強度</label>
      <div class="range-row"><input id="shadowStrength" type="range" min="0" max="35" value="14"><output id="shadowStrengthOut">14%</output></div>
    </div>
    <div class="field">
      <label for="shadowBlur">陰影柔和度</label>
      <div class="range-row"><input id="shadowBlur" type="range" min="4" max="32" value="18"><output id="shadowBlurOut">18 px</output></div>
    </div>
    <div class="field">
      <label for="shadowY">陰影下移</label>
      <div class="range-row"><input id="shadowY" type="range" min="0" max="24" value="7"><output id="shadowYOut">7 px</output></div>
    </div>
    <div class="field">
      <label for="shadowScale">陰影擴散</label>
      <div class="range-row"><input id="shadowScale" type="range" min="96" max="115" value="103"><output id="shadowScaleOut">103%</output></div>
    </div>
    <div class="field checkbox-field">
      <label><input id="addShadow" type="checkbox" checked> 加入自然柔和陰影</label>
    </div>
  </div>
</section>

<section class="card">
  <div class="section-title"><h2>輸出設定</h2></div>
  <div class="settings">
    <div class="field">
      <label for="size">輸出尺寸</label>
      <select id="size"><option value="1000">1000 × 1000 px</option><option value="1500">1500 × 1500 px</option><option value="2000">2000 × 2000 px</option><option value="original">依原圖比例，最短邊 1000 px</option></select>
    </div>
    <div class="field">
      <label for="format">輸出格式</label>
      <select id="format"><option value="image/jpeg">JPG 95%</option><option value="image/png">PNG</option><option value="image/webp">WebP 95%</option></select>
    </div>
    <div class="field">
      <label for="background">背景</label>
      <select id="background"><option value="#ffffff">純白</option><option value="#fafafa">極淺灰白</option></select>
    </div>
  </div>
  <div class="actions">
    <button id="processBtn" class="primary" disabled>開始製作白底棚拍圖</button>
    <button id="clearBtn" class="secondary" disabled>清除</button>
  </div>
  <p id="status" class="status-text"></p>
</section>

<section class="card results" id="resultsSection" hidden>
  <div class="result-head"><div><h2>處理結果</h2><p id="summary">共 0 張</p></div><button id="downloadAllBtn" class="primary small" disabled>下載全部 ZIP</button></div>
  <div id="resultList"></div>
</section>

<footer>獨立圖片處理工具</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="studio.js"></script>
</body>
</html>
