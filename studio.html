<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>商品白底棚拍工具 V7｜智慧輪廓＋商品保真版</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="hero">
  <div class="eyebrow">電商商品圖片工具</div>
  <h1>商品白底棚拍工具</h1>
  <p>智慧去背 × 商品保真 × 純白背景 × 自然陰影</p>
  <div class="badge">V7｜智慧輪廓＋商品保真版</div>
  <div class="sub">這一版真正移除原始背景，只保留商品本體</div>
</header>

<main class="container">
  <section class="card">
    <label class="dropzone" id="dropzone">
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <div class="plus">＋</div>
      <strong>拖曳商品照片到這裡</strong>
      <span>或點擊選擇圖片，可一次選擇多張</span>
      <small>JPG / PNG / WebP</small>
    </label>
    <div class="file-status" id="fileStatus">尚未選取檔案</div>
  </section>

  <section class="card">
    <h2>商品保真設定</h2>

    <div class="setting">
      <div class="setting-title"><span>背景辨識</span><b id="tolValue">保守</b></div>
      <input id="tolerance" type="range" min="1" max="3" value="1">
      <div class="hint">保守：優先保護白色商品、Logo、文字與外框。建議先用此設定。</div>
    </div>

    <div class="setting">
      <div class="setting-title"><span>輪廓保護</span><b id="protectValue">4 px</b></div>
      <input id="protect" type="range" min="1" max="8" value="4">
      <div class="hint">數值越高，越不容易吃掉商品邊緣。</div>
    </div>

    <label class="check"><input id="shadow" type="checkbox" checked><span>加入自然接觸陰影</span></label>

    <div class="row">
      <label class="selectbox"><span>輸出尺寸</span>
        <select id="size">
          <option value="1000">1000 × 1000 px</option>
          <option value="1200">1200 × 1200 px</option>
          <option value="1500">1500 × 1500 px</option>
        </select>
      </label>
      <label class="selectbox"><span>輸出格式</span>
        <select id="format">
          <option value="image/jpeg">JPG 95%</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP 95%</option>
        </select>
      </label>
    </div>

    <button class="primary" id="processBtn" disabled>開始製作白底棚拍圖</button>
    <button class="secondary" id="zipBtn" disabled>下載全部 ZIP</button>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-label"><span id="progressText">準備中</span><span id="progressPct">0%</span></div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
    <div class="error" id="error"></div>
  </section>

  <section class="card results-card">
    <div class="results-head"><h2>處理結果</h2><button class="clear" id="clearBtn">清除全部</button></div>
    <div id="results"><div class="empty">尚無處理結果</div></div>
  </section>
</main>
<script src="studio.js"></script>
</body>
</html>
