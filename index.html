<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>酷澎圖片尺寸檢查＋自動調整工具 V3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>酷澎圖片尺寸檢查工具</h1>
      <p>依原始比例等比例調整，並批次打包下載</p>
      <span class="version">V3｜ZIP 批次下載版</span>
    </header>

    <section class="card">
      <label class="dropzone" id="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <div class="drop-icon">＋</div>
        <strong>拖曳圖片到這裡</strong>
        <span>或點擊選擇圖片，可一次選多張</span>
      </label>

      <div class="settings">
        <div class="field">
          <label for="minSize">最小單邊尺寸</label>
          <div class="input-unit"><input id="minSize" type="number" min="1" value="1000"><span>px</span></div>
        </div>
        <div class="field">
          <label for="maxSize">最大單邊尺寸</label>
          <div class="input-unit"><input id="maxSize" type="number" min="1" value="10000"><span>px</span></div>
        </div>
        <div class="field">
          <label for="maxMB">最大檔案大小</label>
          <div class="input-unit"><input id="maxMB" type="number" min="0.1" step="0.1" value="50"><span>MB</span></div>
        </div>
        <div class="field">
          <label for="format">輸出格式</label>
          <select id="format">
            <option value="original">依原格式</option>
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div class="field full">
          <label for="quality">JPG / WebP 品質</label>
          <div class="input-unit"><input id="quality" type="number" min="1" max="100" value="95"><span>%</span></div>
        </div>
      </div>

      <div class="actions">
        <button id="checkBtn" class="primary" disabled>開始檢查</button>
        <button id="clearBtn" class="secondary" disabled>清除</button>
      </div>

      <p class="hint">規則：短邊低於最小值會等比例放大；超過最大值會等比例縮小。若兩個限制無法同時滿足，會標示為「需人工處理」，不會自動裁切。</p>
    </section>

    <section class="card results" id="resultsSection" hidden>
      <div class="result-head">
        <div>
          <h2>檢查結果</h2>
          <p id="summary">共 0 張</p>
        </div>
        <button id="downloadAllBtn" class="primary small" disabled>下載全部（ZIP）</button>
      </div>
      <div id="resultList"></div>
    </section>

    <section class="card note">
      <h2>使用方式</h2>
      <ol>
        <li>一次選擇一張或多張商品圖片。</li>
        <li>確認最小、最大尺寸與輸出格式。</li>
        <li>按「開始檢查」。</li>
        <li>可逐張下載，或按「下載全部（ZIP）」一次打包。</li>
        <li>ZIP 下載後可在 iPhone「檔案」App 中找到並解壓縮。</li>
      </ol>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
